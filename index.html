<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silva Loyalty - Mi Tarjeta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="notification-container"></div>

    <div id="overlay-carga">
        <div class="spinner"></div>
        <div class="loading-text" id="texto-carga">CONECTANDO...</div>
    </div>

    <div class="container">
        
        <div id="view-login" class="box">
            <div class="logo-container">
                <div class="logo-circle">
                    <img src="img/LogoLueve.jpg" alt="Logo Llueve Café">
                </div>
            </div>

            <h2 id="title-action" style="color: white; margin-bottom: 5px;">BIENVENIDO</h2>
            <p id="desc-action" style="font-size:14px; margin-bottom:20px; color: rgba(255,255,255,0.6);">Ingresa tu teléfono para ver tu saldo</p>
            
            <input type="number" id="inp-tel" inputmode="tel" placeholder="Número de teléfono">
            
            <div id="sec-name" class="hidden">
                <input type="text" id="inp-name" placeholder="Tu Nombre Completo">
            </div>

            <button id="btn-main" class="btn-search" onclick="procesarAcceso()">ENTRAR</button>
            <button id="btn-switch" class="btn-link" onclick="modoRegistro()">No tengo cuenta, registrarme</button>
        </div>

        <div id="view-card" class="hidden" style="width: 100%;">
            <div class="view-card-bank">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div class="card-chip"></div>
                        <span style="font-size: 20px; color: rgba(212, 175, 55, 0.3); transform: rotate(90deg); font-weight: bold;">(((</span>
                    </div>
                    <img src="img/LogoLueve.jpg" alt="Logo" style="width: 55px; height: 55px; border-radius: 50%; border: 2px solid white; background: white; object-fit: contain;">
                </div>

                <div style="margin-top: 5px;">
                    <div class="card-label">Saldo Disponible</div>
                    <div class="card-number" id="txt-pts">$0.00</div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                    <div>
                        <div class="card-label">Titular</div>
                        <div class="card-holder" id="txt-user-name">CLIENTE</div>
                    </div>
                    <button class="btn-refresh" onclick="recargarSaldo()">
                        <span>&#8635;</span>
                    </button>
                </div>
            </div>

            <div class="box glass-qr">
                <div class="qr-box">
                    <img id="img-qr" src="" alt="QR" style="width:100%">
                </div>
                <p style="font-size: 12px; color: #888; margin-top: 15px; padding: 0 10px;">
                    Muestra este código en caja para acumular puntos.
                </p>
                <button class="btn-link" onclick="location.reload()" style="color: #f1c40f; font-weight: bold; margin-top: 10px;">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
